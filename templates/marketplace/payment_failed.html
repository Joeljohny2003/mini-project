<!DOCTYPE html>
<html>
<head>
    <title>Payment Failed</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 450px;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #dc3545;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Payment Failed</h1>

    <p>
        {{ message }}
    </p>

    <p>
        Order #{{ order.id }}
    </p>

    <a href="{% url 'checkout' %}">
        Try Again
    </a>

</div>

</body>
</html>
