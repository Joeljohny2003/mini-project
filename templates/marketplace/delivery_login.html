{% extends 'marketplace/base.html' %}

{% block content %}
<div class="container py-5" style="max-width:520px">
    <h1 class="mb-2">Delivery Person Login</h1>
    <p class="text-muted mb-4">Sign in to manage your assigned deliveries.</p>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required></div>
        <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    <p class="mt-4">New delivery person? <a href="{% url 'delivery_register' %}">Create an account</a></p>
</div>
{% endblock %}
