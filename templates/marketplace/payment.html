<!DOCTYPE html>
<html>
<head>
    <title>Payment - Thrift Store</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .payment-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .payment-box h2 {
            margin-bottom: 10px;
        }

        .payment-box p {
            color: #666;
        }

        #pay-button {
            background: #3399cc;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        #pay-button:hover {
            background: #287fa8;
        }
    </style>
</head>

<body>

<div class="payment-box">

    <h2>Complete Your Payment</h2>

    <p>
        Order #{{ order.id }}
    </p>

    <p>
        Amount: ₹{{ order.total_amount }}
    </p>

    <button id="pay-button">
        Pay Now
    </button>

</div>


<script>

    var options = {

        "key": "{{ razorpay_key_id }}",

        "amount": "{{ amount }}",

        "currency": "INR",

        "name": "Thrift Store",

        "description": "Purchase from Thrift Store",

        "order_id": "{{ razorpay_order_id }}",

        "handler": function (response) {

            var successUrl =
                "{% url 'payment_success' order.id %}" +
                "?razorpay_payment_id=" +
                encodeURIComponent(response.razorpay_payment_id) +
                "&razorpay_order_id=" +
                encodeURIComponent(response.razorpay_order_id) +
                "&razorpay_signature=" +
                encodeURIComponent(response.razorpay_signature);

            window.location.href = successUrl;
        },

        "prefill": {
            "name": "{{ order.full_name }}",
            "email": "{{ order.user.email }}",
            "contact": "{{ order.phone }}"
        },

        "theme": {
            "color": "#3399cc"
        },

        "modal": {
            "confirm_close": true,
            "ondismiss": function() {
                console.log("Razorpay checkout closed.");
            }
        }

    };


    var rzp = new Razorpay(options);


    rzp.on('payment.failed', function (response) {

        console.log("Payment failed:", response.error);

        alert(
            "Payment failed.\n\n" +
            response.error.description
        );

    });


    document.getElementById('pay-button').onclick = function(e) {

        e.preventDefault();

        rzp.open();

    };

</script>

</body>
</html>
